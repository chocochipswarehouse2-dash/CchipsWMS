<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --radius: 8px;
    }

    [data-theme="dark"] {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --input-bg: #0d1117;
      --text: #c9d1d9;
      --muted: #8b949e;
      --primary: #f39c12;
      --primary-hover: #e08e0b;
      --danger: #f85149;
      --danger-hover: #da3633;
      --success: #2ea043;
      --success-hover: #238636;
      --table-hover: rgba(255, 255, 255, 0.03);
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    [data-theme="light"] {
      --bg: #f4f6f8;
      --card: #ffffff;
      --border: #d0d7de;
      --input-bg: #ffffff;
      --text: #24292f;
      --muted: #57606a;
      --primary: #b45309;
      --primary-hover: #92400e;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --success: #16a34a;
      --success-hover: #15803d;
      --table-hover: rgba(0, 0, 0, 0.02);
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important; }
    code, pre, .mono { font-family: 'JetBrains Mono', monospace !important; }
    b, strong, th, .btn, button { font-weight: 600 !important; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      padding: 20px 24px 40px;
      text-transform: uppercase;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .wrap {
      width: 100%;
      max-width: none;
      margin: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      box-shadow: var(--shadow);
    }

    .page-title {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 1.5px;
      margin-bottom: 4px;
    }

    .page-title::before {
      content: "WMS · ";
      color: var(--primary);
    }

    .user-info {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 16px;
      font-weight: 400;
    }

    .toolbar {
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
      box-shadow: none;
      width: 100%;
    }

    .toolbar select.nav-select {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
      cursor: pointer;
      outline: none;
      text-transform: uppercase;
    }
    .toolbar select.nav-select:focus { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }

    .toolbar input[type="text"] {
      flex: 1;
      min-width: 220px;
      height: 42px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
      background: var(--input-bg);
      color: #ffffff;
      outline: none;
      text-transform: uppercase;
    }
    .toolbar input[type="text"]::placeholder { color: #555c66; }
    .toolbar input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }

    .btn-logout {
      background: var(--danger);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      height: 42px;
      padding: 0 18px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-left: auto;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s;
    }
    .btn-logout:hover { background: var(--danger-hover); }

    .custom-multiselect {
      position: relative;
      min-width: 150px;
    }

    .ms-toggle {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      height: 42px;
      padding: 0 14px;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      font-weight: 700;
      text-transform: uppercase;
    }
    .ms-toggle:hover { border-color: var(--primary); color: var(--primary); }

    .ms-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      display: none;
      z-index: 100;
      padding: 10px;
      min-width: 200px;
    }

    .custom-multiselect.open .ms-dropdown {
      display: block;
    }

    .ms-search-input {
      width: 100%;
      height: 36px;
      padding: 0 10px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 12px;
      outline: none;
      background: var(--input-bg);
      color: #fff;
      text-transform: uppercase;
    }
    .ms-search-input:focus { border-color: var(--primary); }

    .ms-options-list {
      max-height: 160px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .ms-option-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 4px;
      color: var(--text);
    }
    .ms-option-item:hover { background: rgba(243, 156, 18, 0.1); color: var(--primary); }
    .ms-option-item input[type="checkbox"] { cursor: pointer; accent-color: var(--primary); }

    .table-container {
      width: 100%;
      max-height: 65vh;
      overflow-x: auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--input-bg);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }

    table {
      width: 100%;
      border-collapse: separate; 
      border-spacing: 0;
      text-align: left;
      font-size: 12px;
    }

    th {
      background: var(--card);
      color: var(--muted);
      font-weight: 600;
      font-size: 11.5px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 10;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    td {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      white-space: nowrap;
      transition: background 0.15s ease;
    }

    tr:hover td { background: var(--table-hover); }

    .badge {
      font-weight: 700;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      display: inline-block;
      text-align: center;
      letter-spacing: 0.5px;
    }
    .badge-in { color: #111; background: var(--success); }
    .badge-out { color: #fff; background: var(--danger); }
    .badge-other { color: #111; background: var(--primary); }

    .footer-pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding: 4px 2px;
      font-size: 12px;
      color: var(--muted);
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn-page {
      background: var(--input-bg);
      color: var(--primary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      height: 36px;
      padding: 0 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .btn-page:hover:not(:disabled) { border-color: var(--primary); background: rgba(243, 156, 18, 0.1); }
    .btn-page:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    @media (max-width: 768px) {
      body { padding: 6px; }
      .toolbar {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .toolbar input[type="text"],
      .custom-multiselect,
      .toolbar select.nav-select {
        width: 100% !important;
      }
      .btn-logout {
        margin-left: 0 !important;
        width: 100%;
        text-align: center;
      }
      .ms-dropdown {
        width: 100%;
        left: 0;
      }
      .hide-mobile { display: none !important; }
    }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="page-title">LOG PRODUK</div>
    <div class="user-info" id="userInfoDisplay">LOGIN SEBAGAI: MEMUAT...</div>

    <div class="toolbar">
      <div id="navContainer" style="width: auto;"></div>
      
      <input type="text" id="searchInput" placeholder="CARI SKU / NAMA PRODUK / INVOICE...">

      <div class="custom-multiselect" id="msType">
        <div class="ms-toggle" onclick="toggleDropdown('msType', event)">
          <span id="labelType">SEMUA TYPE</span>
          <span>&#9660;</span>
        </div>
        <div class="ms-dropdown">
          <input type="text" class="ms-search-input" placeholder="CARI TYPE..." oninput="filterOptions('msType', this.value)">
          <div class="ms-options-list" id="listType"></div>
        </div>
      </div>

      <div class="custom-multiselect" id="msArea">
        <div class="ms-toggle" onclick="toggleDropdown('msArea', event)">
          <span id="labelArea">SEMUA AREA</span>
          <span>&#9660;</span>
        </div>
        <div class="ms-dropdown">
          <input type="text" class="ms-search-input" placeholder="CARI AREA..." oninput="filterOptions('msArea', this.value)">
          <div class="ms-options-list" id="listArea"></div>
        </div>
      </div>

      <div class="custom-multiselect" id="msLokasi">
        <div class="ms-toggle" onclick="toggleDropdown('msLokasi', event)">
          <span id="labelLokasi">SEMUA LOKASI</span>
          <span>&#9660;</span>
        </div>
        <div class="ms-dropdown">
          <input type="text" class="ms-search-input" placeholder="CARI LOKASI..." oninput="filterOptions('msLokasi', this.value)">
          <div class="ms-options-list" id="listLokasi"></div>
        </div>
      </div>

      <button type="button" id="btnToggleTheme" class="btn-logout" style="background:var(--input-bg); color:var(--text); border:1px solid var(--border); margin-left:auto;" onclick="toggleTheme()">☀️ LIGHT MODE</button>
      <button type="button" class="btn-logout" style="margin-left:0;" onclick="logoutSession()">LOGOUT</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>TANGGAL</th>
            <th>TYPE</th>
            <th class="hide-mobile">INVOICE</th>
            <th>SKU</th>
            <th>NAMA PRODUK</th>
            <th>SIZE</th>
            <th class="hide-mobile">AREA</th>
            <th>LOKASI</th>
            <th class="hide-mobile">OPERATOR</th>
            <th class="hide-mobile">KETERANGAN</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td colspan="10" style="text-align:center; padding:30px; color:var(--muted); font-style:italic;">MEMUAT DATA...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div id="paginationFooter" class="footer-pagination" style="display: none;">
      <span id="paginationInfo">SHOWING 0-0 OF 0 RECORDS</span>
      <div style="display: flex; gap: 8px; align-items: center;">
        <button type="button" class="btn-page" id="btnPrev" onclick="changePage(-1)">PREV</button>
        <span id="pageIndicator" style="font-weight: 700; color: var(--primary);">1 / 1</span>
        <button type="button" class="btn-page" id="btnNext" onclick="changePage(1)">NEXT</button>
      </div>
    </div>
  </div>

  <script>
    const TOKEN = "<?= token ?>";
    const EXEC_URL = "<?= execUrl ?>";
    const AKSES = "<?= akses ?>";
    const USERNAME = "<?= username || '' ?>";

    let LOG_DATA = [];
    let currentPage = 1;
    const pageSize = 40;
    let totalPages = 1;

    // ============ THEME MANAGER ============
    function initTheme() {
      const savedTheme = localStorage.getItem('wms_theme') || 'dark';
      document.body.setAttribute('data-theme', savedTheme);
      updateThemeButtonText(savedTheme);
    }

    function updateThemeButtonText(theme) {
      const btn = document.getElementById('btnToggleTheme');
      if (!btn) return;
      btn.innerHTML = (theme === 'dark') ? '☀️ LIGHT MODE' : '🌙 DARK MODE';
    }

    function toggleTheme() {
      const currentTheme = document.body.getAttribute('data-theme') || 'dark';
      const newTheme = (currentTheme === 'dark') ? 'light' : 'dark';
      document.body.setAttribute('data-theme', newTheme);
      localStorage.setItem('wms_theme', newTheme);
      updateThemeButtonText(newTheme);
    }
    initTheme();

    const selectedFilters = {
      Type: new Set(),
      Area: new Set(),
      Lokasi: new Set()
    };

    const MENU_WMS_LIST = [
      { value: "produk", label: "INVENTORY", akses: "Produk" },
      { value: "klasifikasi", label: "MONITORING & KLASIFIKASI", akses: "All" },
      { value: "penerimaanproduksi", label: "PENERIMAAN PRODUKSI", akses: "All" },
      { value: "fulfillment", label: "FULFILLMENT REFILL", akses: "Fulfillment" },
      { value: "peminjaman", label: "PEMINJAMAN", akses: "Peminjaman" },
      { value: "logproduk", label: "LOG PRODUK", akses: "All" },
      { value: "logmutasi", label: "LOG MUTASI", akses: "All" },
      { value: "updatedatabase", label: "UPDATE DATABASE", akses: "All" },
      { value: "stockopname", label: "STOCK OPNAME", akses: "All" }
    ];
    const HALAMAN_AKTIF_WMS = "logproduk";

    function bisaAksesMenuWms(kode) {
      if (typeof AKSES === "undefined" || !AKSES) return true;
      const roles = String(AKSES).split(',').map(function(r) { return r.trim(); });
      return roles.includes("All") || roles.includes(kode);
    }

    document.getElementById('userInfoDisplay').textContent = "LOGIN SEBAGAI: " + (USERNAME || "ADMIN").toUpperCase();

    function renderNavBar() {
      const container = document.getElementById('navContainer');
      if (!container) return;

      const select = document.createElement('select');
      select.className = 'nav-select';
      MENU_WMS_LIST.forEach(function (m) {
        if (!bisaAksesMenuWms(m.akses)) return;
        const opt = document.createElement('option');
        opt.value = m.value;
        opt.textContent = m.label;
        if (m.value === HALAMAN_AKTIF_WMS) opt.selected = true;
        select.appendChild(opt);
      });
      select.addEventListener('change', function () {
        const val = select.value;
        window.top.location.href = EXEC_URL + '?token=' + encodeURIComponent(TOKEN) + (val ? '&page=' + encodeURIComponent(val) : '');
      });
      container.appendChild(select);
    }
    renderNavBar();

    function logoutSession() {
      google.script.run.logoutWmsSession(TOKEN);
      window.top.location.href = EXEC_URL;
    }

    function toggleDropdown(id, ev) {
      if (ev) ev.stopPropagation();
      const el = document.getElementById(id);
      const isOpen = el.classList.contains('open');
      document.querySelectorAll('.custom-multiselect').forEach(d => d.classList.remove('open'));
      if (!isOpen) {
        el.classList.add('open');
        const input = el.querySelector('.ms-search-input');
        if (input) input.focus();
      }
    }

    window.addEventListener('click', function() {
      document.querySelectorAll('.custom-multiselect').forEach(d => d.classList.remove('open'));
    });

    document.querySelectorAll('.ms-dropdown').forEach(d => {
      d.addEventListener('click', function(e) { e.stopPropagation(); });
    });

    const CACHE_KEY_LOG_PRODUK = 'wms_cache_log_produk';
    let isLogRenderedFromCache = false;

    function muatDataLog() {
      try {
        const cached = localStorage.getItem(CACHE_KEY_LOG_PRODUK);
        if (cached) {
          LOG_DATA = JSON.parse(cached) || [];
          if (LOG_DATA.length > 0) {
            setupMultiSelectFilters();
            currentPage = 1;
            renderLogTable();
            isLogRenderedFromCache = true;
          }
        }
      } catch(e) {}

      if (!isLogRenderedFromCache) {
        document.getElementById('tableBody').innerHTML = '<tr><td colspan="10" style="text-align:center; padding:30px; color:var(--muted); font-style:italic;">MEMUAT DATA...</td></tr>';
      }
      
      google.script.run.withSuccessHandler(function (res) {
        if (!res.success) {
          if (!isLogRenderedFromCache) {
            document.getElementById('tableBody').innerHTML =
              '<tr><td colspan="10" style="text-align:center; color:var(--danger); padding:30px;">' + res.message + '</td></tr>';
          }
          return;
        }
        LOG_DATA = res.data || [];
        try {
          localStorage.setItem(CACHE_KEY_LOG_PRODUK, JSON.stringify(LOG_DATA));
        } catch(e) {}
        
        setupMultiSelectFilters();
        renderLogTable();
      }).withFailureHandler(function (err) {
        if (!isLogRenderedFromCache) {
          document.getElementById('tableBody').innerHTML =
            '<tr><td colspan="10" style="text-align:center; color:var(--danger); padding:30px;">GAGAL MEMUAT DATA: ' + err.message + '</td></tr>';
        }
      }).getWmsLogProdukData(TOKEN);
    }

    function setupMultiSelectFilters() {
      populateMsList('Type', Array.from(new Set(LOG_DATA.map(d => d.type).filter(Boolean))).sort());
      populateMsList('Area', Array.from(new Set(LOG_DATA.map(d => d.area).filter(Boolean))).sort());
      populateMsList('Lokasi', Array.from(new Set(LOG_DATA.map(d => d.lokasi).filter(Boolean))).sort());
    }

    function populateMsList(field, items) {
      const listEl = document.getElementById('list' + field);
      listEl.innerHTML = '';
      items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'ms-option-item';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.value = item;
        if (selectedFilters[field].has(item)) {
          checkbox.checked = true;
        }

        checkbox.addEventListener('change', function() {
          onSelectFilter(field, item, this.checked);
        });

        const span = document.createElement('span');
        span.textContent = item;

        div.appendChild(checkbox);
        div.appendChild(span);

        div.addEventListener('click', function(e) {
          if (e.target !== checkbox) {
            checkbox.checked = !checkbox.checked;
            onSelectFilter(field, item, checkbox.checked);
          }
        });

        listEl.appendChild(div);
      });
    }

    function filterOptions(containerId, query) {
      const container = document.getElementById(containerId);
      const q = query.toLowerCase();
      container.querySelectorAll('.ms-option-item').forEach(item => {
        const text = item.textContent.toLowerCase();
        item.style.display = text.includes(q) ? 'flex' : 'none';
      });
    }

    function onSelectFilter(field, value, isChecked) {
      if (isChecked) {
        selectedFilters[field].add(value);
      } else {
        selectedFilters[field].delete(value);
      }

      const labelEl = document.getElementById('label' + field);
      const count = selectedFilters[field].size;
      if (count === 0) {
        labelEl.textContent = 'SEMUA ' + field.toUpperCase();
      } else {
        labelEl.textContent = `${count} DIPILIH`;
      }

      currentPage = 1;
      renderLogTable();
    }

    function renderLogTable() {
      const tbody = document.getElementById('tableBody');
      const footer = document.getElementById('paginationFooter');
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const kataKunci = keyword.split(/\s+/).filter(Boolean);

      const filtered = LOG_DATA.filter(function (d) {
        const cocokType = selectedFilters.Type.size === 0 || selectedFilters.Type.has(d.type);
        const cocokArea = selectedFilters.Area.size === 0 || selectedFilters.Area.has(d.area);
        const cocokLokasi = selectedFilters.Lokasi.size === 0 || selectedFilters.Lokasi.has(d.lokasi);

        const teksGabungan = (d.sku + ' ' + d.namaProduk + ' ' + d.invoice + ' ' + d.operator + ' ' + d.keterangan).toLowerCase();
        const cocokKeyword = kataKunci.length === 0 ||
          kataKunci.every(function (kw) { return teksGabungan.indexOf(kw) > -1; });

        return cocokType && cocokArea && cocokLokasi && cocokKeyword;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10" style="text-align:center; color:var(--muted); padding:30px; font-style:italic;">TIDAK ADA DATA YANG COCOK.</td></tr>';
        footer.style.display = 'none';
        return;
      }

      totalPages = Math.ceil(filtered.length / pageSize);
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      const startIndex = (currentPage - 1) * pageSize;
      const paginatedData = filtered.slice(startIndex, startIndex + pageSize);

      tbody.innerHTML = paginatedData.map(function (d) {
        let badgeClass = 'badge-other';
        if (d.type === 'IN') badgeClass = 'badge-in';
        else if (d.type === 'OUT') badgeClass = 'badge-out';

        return '<tr>' +
          '<td>' + (d.tanggalStr || '-') + '</td>' +
          '<td><span class="badge ' + badgeClass + '">' + (d.type || '-') + '</span></td>' +
          '<td class="hide-mobile" style="font-weight:700;">' + (d.invoice || '-') + '</td>' +
          '<td style="font-weight:700; color:var(--primary);">' + (d.sku || '-') + '</td>' +
          '<td>' + (d.namaProduk || '-') + '</td>' +
          '<td>' + (d.size || '-') + '</td>' +
          '<td class="hide-mobile">' + (d.area || '-') + '</td>' +
          '<td>' + (d.lokasi || '-') + '</td>' +
          '<td class="hide-mobile">' + (d.operator || '-') + '</td>' +
          '<td class="hide-mobile" style="color:var(--muted);">' + (d.keterangan || '-') + '</td>' +
        '</tr>';
      }).join('');

      const startRecord = startIndex + 1;
      const endRecord = Math.min(startIndex + pageSize, filtered.length);
      document.getElementById('paginationInfo').textContent = `SHOWING ${startRecord}-${endRecord} OF ${filtered.length} RECORDS`;
      document.getElementById('pageIndicator').textContent = `${currentPage} / ${totalPages}`;
      
      document.getElementById('btnPrev').disabled = (currentPage <= 1);
      document.getElementById('btnNext').disabled = (currentPage >= totalPages);
      footer.style.display = 'flex';
    }

    function changePage(direction) {
      const newPage = currentPage + direction;
      if (newPage >= 1 && newPage <= totalPages) {
        currentPage = newPage;
        renderLogTable();
      }
    }

    document.getElementById('searchInput').addEventListener('input', function() {
      currentPage = 1;
      renderLogTable();
    });

    muatDataLog();
  </script>
</body>
</html>
