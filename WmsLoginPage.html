<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --radius: 8px;
    }

    [data-theme="dark"] {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --input-bg: #0d1117;
      --text: #c9d1d9;
      --muted: #8b949e;
      --primary: #f39c12;
      --primary-hover: #e08e0b;
      --danger: #f85149;
      --danger-hover: #da3633;
      --success: #2ea043;
      --success-hover: #238636;
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
    }

    [data-theme="light"] {
      --bg: #f4f6f8;
      --card: #ffffff;
      --border: #d0d7de;
      --input-bg: #ffffff;
      --text: #24292f;
      --muted: #57606a;
      --primary: #b45309;
      --primary-hover: #92400e;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --success: #16a34a;
      --success-hover: #15803d;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    * { 
      box-sizing: border-box; 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important; 
    }
    
    code, pre, .mono {
      font-family: 'JetBrains Mono', monospace !important;
    }
    
    b, strong, th, .btn, button { font-weight: 600 !important; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-transform: uppercase;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .login-wrap {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 28px;
      box-shadow: var(--shadow);
      position: relative;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .brand-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 2px;
      margin: 0 0 6px 0;
    }

    .brand-title::before {
      content: "WMS · ";
      color: var(--primary);
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 1px;
      margin: 0;
    }

    .field {
      margin-bottom: 20px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
      background: var(--input-bg);
      color: var(--text);
      outline: none;
      transition: all 0.2s;
    }

    input[type="text"] {
      text-transform: uppercase;
    }

    input[type="password"] {
      text-transform: none;
    }

    .password-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-wrap input {
      padding-right: 44px;
    }

    .btn-toggle-pwd {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 15px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: color 0.2s;
    }

    .btn-toggle-pwd:hover {
      color: var(--primary);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 46px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      margin-top: 8px;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .theme-bar {
      margin-top: 20px;
      display: flex;
      justify-content: center;
    }

    .btn-theme {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.5px;
    }

    .btn-theme svg {
      flex-shrink: 0;
    }

    .btn-theme:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .toast {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      display: none;
      letter-spacing: 0.5px;
    }

    .toast.show { display: block; }
    .toast.ok { background: rgba(46, 160, 67, 0.15); color: var(--success); border: 1px solid var(--success); }
    .toast.err { background: rgba(248, 81, 73, 0.15); color: var(--danger); border: 1px solid var(--danger); }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body data-theme="dark">

  <div class="login-wrap">
    <div class="brand-header">
      <div class="brand-title">WMS CHOCOCHIPS</div>
      <p class="brand-subtitle">Warehouse Management System</p>
    </div>

    <form onsubmit="event.preventDefault(); doLogin();">
      <div class="field">
        <label for="username">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 4px;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          Username
        </label>
        <input type="text" id="username" placeholder="Masukkan username..." autocomplete="username" autofocus required>
      </div>

      <div class="field">
        <label for="password">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 4px;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          Password
        </label>
        <div class="password-wrap">
          <input type="password" id="password" placeholder="Masukkan password..." autocomplete="current-password" required>
          <button type="button" class="btn-toggle-pwd" id="btnTogglePwd" onclick="togglePasswordVisibility()" title="Lihat password">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" id="btnLogin">
        <span id="loginLabel">Masuk</span>
      </button>

      <div class="toast" id="toast"></div>

      <div class="theme-bar">
        <button type="button" class="btn-theme" id="btnToggleTheme" onclick="toggleTheme()"></button>
      </div>
    </form>
  </div>

  <script>
    const EXEC_URL = "<?= execUrl ?>";

    const ICON_SUN = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>';
    const ICON_MOON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';
    const ICON_EYE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
    const ICON_EYE_OFF = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';

    function togglePasswordVisibility() {
      const pwd = document.getElementById('password');
      const btn = document.getElementById('btnTogglePwd');
      if (!pwd || !btn) return;
      if (pwd.type === 'password') {
        pwd.type = 'text';
        btn.innerHTML = ICON_EYE_OFF;
        btn.title = 'Sembunyikan password';
      } else {
        pwd.type = 'password';
        btn.innerHTML = ICON_EYE;
        btn.title = 'Lihat password';
      }
    }

    function initTheme() {
      const savedTheme = localStorage.getItem('wms_theme') || 'dark';
      document.body.setAttribute('data-theme', savedTheme);
      updateThemeButtonText(savedTheme);
    }

    function updateThemeButtonText(theme) {
      const btn = document.getElementById('btnToggleTheme');
      if (!btn) return;
      btn.innerHTML = (theme === 'dark') 
        ? ICON_SUN + ' <span>Light Mode</span>' 
        : ICON_MOON + ' <span>Dark Mode</span>';
    }

    function toggleTheme() {
      const currentTheme = document.body.getAttribute('data-theme') || 'dark';
      const newTheme = (currentTheme === 'dark') ? 'light' : 'dark';
      document.body.setAttribute('data-theme', newTheme);
      localStorage.setItem('wms_theme', newTheme);
      updateThemeButtonText(newTheme);
    }

    initTheme();

    function setLoading(isLoading) {
      const btn = document.getElementById('btnLogin');
      const label = document.getElementById('loginLabel');
      btn.disabled = isLoading;
      label.innerHTML = isLoading
        ? '<span class="spinner"></span> Memeriksa...'
        : 'Masuk';
    }

    function showToast(ok, msg) {
      const el = document.getElementById('toast');
      el.className = 'toast show ' + (ok ? 'ok' : 'err');
      el.textContent = msg;
    }

    // Inisialisasi form login: bersihkan token usang agar tidak loop/loading terus
    (function initLoginForm() {
      try {
        // Hapus token usang karena server sudah mengarahkan ke halaman login
        localStorage.removeItem('wms_token');
        sessionStorage.removeItem('wms_token');

        // Isi otomatis username yang terakhir kali digunakan (jika ada)
        const savedUsername = localStorage.getItem('wms_saved_username');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');

        if (savedUsername && usernameInput) {
          usernameInput.value = savedUsername;
          if (passwordInput) passwordInput.focus();
        } else if (usernameInput) {
          usernameInput.focus();
        }
      } catch (e) {}
    })();

    function doLogin() {
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const username = usernameInput ? usernameInput.value.trim() : '';
      const password = passwordInput ? passwordInput.value : '';

      if (!username || !password) {
        showToast(false, 'USERNAME DAN PASSWORD WAJIB DIISI.');
        return;
      }

      setLoading(true);

      google.script.run.withSuccessHandler(function (res) {
        if (res && res.success) {
          const btn = document.getElementById('btnLogin');
          const label = document.getElementById('loginLabel');
          if (btn) btn.disabled = true;
          if (label) label.innerHTML = '<span class="spinner"></span> 🚀 MEMBUKA DASHBOARD...';
          showToast(true, 'LOGIN BERHASIL! MEMBUKA DASHBOARD WMS...');

          try {
            localStorage.setItem('wms_saved_username', res.username || username);
            sessionStorage.setItem('wms_token', res.token);
            sessionStorage.setItem('wms_role', res.akses || res.role);
            sessionStorage.setItem('wms_username', res.username);
            localStorage.setItem('wms_token', res.token);
            localStorage.setItem('wms_role', res.akses || res.role);
            localStorage.setItem('wms_username', res.username);
          } catch (e) {}

          const redirectUrl = EXEC_URL + '?token=' + encodeURIComponent(res.token);
          window.top.location.href = redirectUrl;
        } else {
          setLoading(false);
          showToast(false, (res ? res.message : null) || 'LOGIN GAGAL: USERNAME ATAU PASSWORD SALAH.');
        }
      }).withFailureHandler(function (err) {
        setLoading(false);
        showToast(false, 'GAGAL LOGIN: ' + (err ? err.message : 'Koneksi terputus'));
      }).verifyWmsLogin(username, password);
    }
  </script>
</body>
</html>
